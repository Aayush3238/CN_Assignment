[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netarchitect"
version = "1.0.0"
description = "Explainable network architecture recommendation and Cisco IOS configuration engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]
report = ["reportlab>=4.0"]

[project.scripts]
netarchitect = "netarchitect.cli:app"

[tool.setuptools.packages.find]
include = ["netarchitect*"]

[tool.setuptools.package-data]
netarchitect = [
    "presets/*.json",
    "configs/templates/*.j2",
    "web/templates/*.html",
    "web/static/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
