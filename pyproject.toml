[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netarchitect"
version = "0.1.0"
description = "Explainable network architecture recommendation and Cisco IOS config engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
netarchitect = "netarchitect.cli:app"

[tool.setuptools.packages.find]
include = ["netarchitect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
